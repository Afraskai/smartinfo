name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abhängigkeiten installieren
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck make

      - name: ShellCheck
        run: make lint

      - name: Testsuite
        run: make test
