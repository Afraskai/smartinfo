name: CI

# Gitea Actions: läuft auf dem act_runner der Instanz.
# Falls der Runner ein anderes Label als "ubuntu-latest" nutzt, hier anpassen.
on:
  push:
  pull_request:

jobs:
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abhängigkeiten installieren
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y jq shellcheck make
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache jq shellcheck make bash
          fi

      - name: ShellCheck
        run: make lint

      - name: Testsuite
        run: make test
